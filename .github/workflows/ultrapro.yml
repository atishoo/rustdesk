name: UltraPro official release

on:
  push:
    branches:
      - ultrapro
  workflow_dispatch:

permissions:
  contents: write

# Every push to ultrapro publishes the official client matrix artifacts.
jobs:
  build-official-release:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ultrapro
      publish-update-metadata: false

  repair-macos-dmgs:
    needs: build-official-release
    if: ${{ needs.build-official-release.result == 'success' }}
    runs-on: macos-latest
    steps:
      - name: Re-sign and publish macOS apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rustdesk-macos-dmgs"
          mkdir -p "$work"
          gh release download ultrapro \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'rustdesk-*-aarch64.dmg' \
            --pattern 'rustdesk-*-x86_64.dmg' \
            --dir "$work"

          for arch in aarch64 x86_64; do
            input=$(find "$work" -maxdepth 1 -name "rustdesk-*-${arch}.dmg" -print -quit)
            test -n "$input"
            plist="$work/${arch}.plist"
            hdiutil attach -readonly -nobrowse -plist "$input" > "$plist"
            mount_point=$(plutil -extract system-entities.0.mount-point raw -o - "$plist")
            app="$work/RustDesk-${arch}.app"
            ditto "$mount_point/RustDesk.app" "$app"
            hdiutil detach "$mount_point" >/dev/null

            codesign --deep --force --verbose --sign - "$app"
            codesign --verify --deep --strict --verbose=2 "$app"

            fixed="$work/fixed-${arch}.dmg"
            staging="$work/staging-${arch}"
            mkdir "$staging"
            ditto "$app" "$staging/RustDesk.app"
            ln -s /Applications "$staging/Applications"
            hdiutil create -volname RustDesk -srcfolder "$staging" -ov -format UDZO "$fixed"
            mv "$input" "$work/original-${arch}.dmg"
            mv "$fixed" "$input"
            gh release upload ultrapro "$input" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          done
